kind = "web"
previewPath = "/"
title = "Reading Room"
description = "A personal reading library for tracking books read, books owned, and books to read. Includes private accounts, book CRUD, stars, search and sorting, reading insights, a virtual bookshelf, a filtered random picker, and CSV export."
version = "1.0.0"
id = "artifacts/book-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24596

[services.development]
run = "pnpm --filter @workspace/book-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/book-tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/book-tracker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24596"
BASE_PATH = "/"
